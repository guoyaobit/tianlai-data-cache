---
# Verify deployment-guide IPs. Do not use HDM IPs for SSH.
all:
  vars:
    # OS account used by Ansible over SSH.
    ansible_user: ubuntu
    # Controller management IP on the storage server.
    tianlai_controller_ip: "172.0.0.142"
    # Backend IP for triggers and completion notices.
    tianlai_backend_ip: "192.168.200.10"
    # Data IP on the storage server's 100 GbE interface.
    tianlai_storage_ip: "192.168.210.250"
    # Event path under the mounted storage directory.
    tianlai_storage_directory: /data/raw-store
    # First TCP port for storage data listeners.
    tianlai_storage_port: 20000
    tianlai_storage_lane1_port: 20100
    # Debug only: exclude known-offline cache hosts from controller scheduling.
    tianlai_disabled_cache_nodes: []
    tianlai_storage_io_threads: 2
  children:
    cache_nodes:
      # ens2f0 and 192.168.210.100-113 are derived from server ID during deployment.
      hosts:
        tianlaistore1:
          # Host IP used by Ansible over SSH.
          ansible_host: "172.0.0.128"
          # Cache node ID (0-13); must match server config.
          tianlai_server_id: 0
          # Cache-node management IP for control commands.
          tianlai_control_ip: "172.0.0.128"
          # Single physical interface and its untagged data-subnet address.
          tianlai_send_interface: ens2f0
          tianlai_send_ip: "192.168.210.100"
          # Auto-discovers 8 Intel ixcap PCI devices without Linux netdevs.
          tianlai_receive_devices: auto
        tianlaistore2:
