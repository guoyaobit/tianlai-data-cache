---
- name: Derive cache data-network values
  ansible.builtin.include_tasks: cache_send_facts.yml

- name: Install Netplan, NetworkManager, and the Linux IP utility
  ansible.builtin.apt:
    name: [netplan.io, network-manager, iproute2]
    state: present
    update_cache: false

- name: Enable and start NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager.service
    enabled: true
    state: started

- name: Discover high-speed physical interfaces
  ansible.builtin.script:
    cmd: "files/select_jumbo_interfaces.py --minimum-speed {{ tianlai_jumbo_min_speed_mbps }}"
    executable: /usr/bin/python3
  register: jumbo_interface_raw
  changed_when: false
  check_mode: false

- name: Decode high-speed physical interfaces
  ansible.builtin.set_fact:
    tianlai_jumbo_interface_report: "{{ jumbo_interface_raw.stdout | from_json }}"
    tianlai_jumbo_interfaces: "{{ (jumbo_interface_raw.stdout | from_json).interfaces | map(attribute='name') | list }}"
  changed_when: false

- name: Separate generic receive-side interfaces from configured data interfaces
  ansible.builtin.set_fact:
    tianlai_receive_netplan_interfaces: >-
      {{ tianlai_jumbo_interfaces |
      difference([tianlai_send_interface] if 'cache_nodes' in group_names else []) |
      difference([tianlai_storage_receive_interface] if 'storage' in group_names else []) }}
  changed_when: false

- name: Check the fixed cache data interface
  ansible.builtin.stat:
    path: "/sys/class/net/{{ tianlai_send_interface }}"
  register: cache_send_interface
  when: "'cache_nodes' in group_names"

- name: Require ens2f0 on every cache node
  ansible.builtin.assert:
    that: cache_send_interface.stat.exists
    fail_msg: "Required cache data interface {{ tianlai_send_interface }} does not exist"
  when: "'cache_nodes' in group_names"

- name: Check the fixed storage receive interface
  ansible.builtin.stat:
    path: "/sys/class/net/{{ tianlai_storage_receive_interface }}"
  register: storage_receive_interface
  when: "'storage' in group_names"

- name: Require the fixed 100 GbE interface on the storage server
  ansible.builtin.assert:
    that: storage_receive_interface.stat.exists
    fail_msg: "Required storage receive interface {{ tianlai_storage_receive_interface }} does not exist"
  when: "'storage' in group_names"

- name: Install and validate the separate Netplan overlays
  block:
    - name: Write the receive-side Netplan overlay
      ansible.builtin.template:
        src: templates/tianlai-receive.netplan.yaml.j2
        dest: /etc/netplan/98-tianlai-receive.yaml
        mode: '0600'
        backup: true
      register: receive_netplan
    - name: Write the cache send-side Netplan overlay
      ansible.builtin.template:
        src: templates/tianlai-send.netplan.yaml.j2
        dest: /etc/netplan/99-tianlai-send.yaml
        mode: '0600'
        backup: true
      register: send_netplan
      when: "'cache_nodes' in group_names"
    - name: Write the storage receive-side Netplan overlay
      ansible.builtin.template:
        src: templates/tianlai-storage.netplan.yaml.j2
        dest: /etc/netplan/99-tianlai-storage.yaml
        mode: '0600'
        backup: true
      register: storage_netplan
      when: "'storage' in group_names"
    - name: Validate the merged Netplan configuration
      ansible.builtin.command: netplan generate
      changed_when: false
  rescue:
    - name: Restore the previous receive-side Netplan overlay
      ansible.builtin.copy:
        src: "{{ receive_netplan.backup_file }}"
        dest: /etc/netplan/98-tianlai-receive.yaml
        remote_src: true
        mode: '0600'
      when:
        - receive_netplan.changed | default(false)
        - receive_netplan.backup_file | default('') | length > 0
    - name: Remove an invalid first-time receive-side Netplan overlay
      ansible.builtin.file:
        path: /etc/netplan/98-tianlai-receive.yaml
        state: absent
      when:
        - receive_netplan.changed | default(false)
        - receive_netplan.backup_file | default('') | length == 0
    - name: Restore the previous send-side Netplan overlay
      ansible.builtin.copy:
        src: "{{ send_netplan.backup_file }}"
        dest: /etc/netplan/99-tianlai-send.yaml
        remote_src: true
        mode: '0600'
      when:
        - send_netplan is defined
        - send_netplan.changed | default(false)
        - send_netplan.backup_file | default('') | length > 0
    - name: Remove an invalid first-time send-side Netplan overlay
      ansible.builtin.file:
        path: /etc/netplan/99-tianlai-send.yaml
        state: absent
      when:
        - send_netplan is defined
        - send_netplan.changed | default(false)
        - send_netplan.backup_file | default('') | length == 0
    - name: Restore the previous storage-side Netplan overlay
      ansible.builtin.copy:
        src: "{{ storage_netplan.backup_file }}"
        dest: /etc/netplan/99-tianlai-storage.yaml
        remote_src: true
        mode: '0600'
      when:
        - storage_netplan is defined
        - storage_netplan.changed | default(false)
        - storage_netplan.backup_file | default('') | length > 0
    - name: Remove an invalid first-time storage-side Netplan overlay
      ansible.builtin.file:
        path: /etc/netplan/99-tianlai-storage.yaml
        state: absent
      when:
        - storage_netplan is defined
        - storage_netplan.changed | default(false)
        - storage_netplan.backup_file | default('') | length == 0
    - name: Stop after restoring the previous Netplan state
      ansible.builtin.fail:
        msg: Netplan validation failed; the managed overlays were rolled back.

- name: Apply the separate Netplan overlays
  ansible.builtin.command: netplan apply
  changed_when: >-
    (receive_netplan.changed | default(false)) or
    ((send_netplan is defined) and (send_netplan.changed | default(false))) or
    ((storage_netplan is defined) and (storage_netplan.changed | default(false)))

- name: Read NetworkManager ownership for managed data interfaces
  ansible.builtin.command:
    argv: [nmcli, -g, GENERAL.STATE, device, show, "{{ item }}"]
  loop: >-
    {{ tianlai_receive_netplan_interfaces |
    union([tianlai_send_interface] if 'cache_nodes' in group_names else []) |
    union([tianlai_storage_receive_interface] if 'storage' in group_names else []) }}
  register: managed_nm_devices
  changed_when: false

- name: Require NetworkManager ownership of managed data interfaces
  ansible.builtin.assert:
    that:
      - (item.stdout | trim) is not match('^10([^0-9]|$)')
    fail_msg: "{{ item.item }} is not managed by NetworkManager after Netplan apply"
  loop: "{{ managed_nm_devices.results }}"

- name: Read applied MTU values
  ansible.builtin.command:
    argv: [cat, "/sys/class/net/{{ item }}/mtu"]
  loop: >-
    {{ tianlai_jumbo_interfaces |
    union([tianlai_send_interface] if 'cache_nodes' in group_names else []) |
    union([tianlai_storage_receive_interface] if 'storage' in group_names else []) }}
  register: jumbo_mtu_values
  changed_when: false

- name: Require MTU 9000 on every selected interface
  ansible.builtin.assert:
    that: "(item.stdout | int) == (tianlai_jumbo_mtu | int)"
    fail_msg: "{{ item.item }} did not apply MTU {{ tianlai_jumbo_mtu }}"
  loop: "{{ jumbo_mtu_values.results }}"

- name: Read the cache data-interface addresses
  ansible.builtin.command:
    argv: [ip, -j, address, show, dev, "{{ tianlai_send_interface }}"]
  register: cache_send_addresses
  changed_when: false
  when: "'cache_nodes' in group_names"

- name: Require the calculated cache data IP only
  ansible.builtin.assert:
    that:
      - >-
        (((cache_send_addresses.stdout | from_json | first).addr_info |
        selectattr('family', 'equalto', 'inet') | map(attribute='local') | list)
        == [tianlai_send_ip])
    fail_msg: "{{ tianlai_send_interface }} does not have only the expected IP {{ tianlai_send_ip }}"
  when: "'cache_nodes' in group_names"

- name: Check for a default route on the cache data interface
  ansible.builtin.command:
    argv: [ip, -j, route, show, default, dev, "{{ tianlai_send_interface }}"]
  register: cache_send_default_route
  changed_when: false
  when: "'cache_nodes' in group_names"

- name: Require no default route on the cache data interface
  ansible.builtin.assert:
    that: "(cache_send_default_route.stdout | from_json | length) == 0"
    fail_msg: "{{ tianlai_send_interface }} must not provide a default route"
  when: "'cache_nodes' in group_names"

- name: Read the storage receive-interface addresses
  ansible.builtin.command:
    argv: [ip, -j, address, show, dev, "{{ tianlai_storage_receive_interface }}"]
  register: storage_receive_addresses
  changed_when: false
  when: "'storage' in group_names"

- name: Require the configured storage IP only
  ansible.builtin.assert:
    that:
      - >-
        (((storage_receive_addresses.stdout | from_json | first).addr_info |
        selectattr('family', 'equalto', 'inet') | map(attribute='local') | list)
        == [tianlai_storage_ip])
    fail_msg: >-
      {{ tianlai_storage_receive_interface }} must have only {{ tianlai_storage_ip }};
      remove stale or externally managed IPv4 addresses.
  when: "'storage' in group_names"

- name: Check for a default route on the storage receive interface
  ansible.builtin.command:
    argv: [ip, -j, route, show, default, dev, "{{ tianlai_storage_receive_interface }}"]
  register: storage_receive_default_route
  changed_when: false
  when: "'storage' in group_names"

- name: Require no default route on the storage receive interface
  ansible.builtin.assert:
    that: "(storage_receive_default_route.stdout | from_json | length) == 0"
    fail_msg: "{{ tianlai_storage_receive_interface }} must not provide a default route"
  when: "'storage' in group_names"

- name: Read IPv6 addresses on all managed data interfaces
  ansible.builtin.command:
    argv: [ip, -j, -6, address, show, dev, "{{ item }}"]
  loop: >-
    {{ tianlai_receive_netplan_interfaces |
    union([tianlai_send_interface] if 'cache_nodes' in group_names else []) |
    union([tianlai_storage_receive_interface] if 'storage' in group_names else []) }}
  register: managed_ipv6_addresses
  changed_when: false

- name: Require no IPv6 addresses on managed data interfaces
  ansible.builtin.assert:
    that:
      - "((item.stdout | from_json | first).addr_info | length) == 0"
    fail_msg: "{{ item.item }} still has an IPv6 address"
  loop: "{{ managed_ipv6_addresses.results }}"

- name: Display Netplan network result
  ansible.builtin.debug:
    msg:
      mtu: "{{ tianlai_jumbo_mtu }}"
      receive_netplan_file: /etc/netplan/98-tianlai-receive.yaml
      receive_interfaces: "{{ tianlai_receive_netplan_interfaces }}"
      send_netplan_file: "{{ '/etc/netplan/99-tianlai-send.yaml' if 'cache_nodes' in group_names else 'not applicable' }}"
      storage_netplan_file: "{{ '/etc/netplan/99-tianlai-storage.yaml' if 'storage' in group_names else 'not applicable' }}"
      cache_send_interface: "{{ tianlai_send_interface if 'cache_nodes' in group_names else 'not applicable' }}"
      cache_send_ip: "{{ (tianlai_send_ip ~ '/' ~ tianlai_cache_send_prefix_length) if 'cache_nodes' in group_names else 'not applicable' }}"
      storage_receive_interface: "{{ tianlai_storage_receive_interface if 'storage' in group_names else 'not applicable' }}"
      storage_receive_ip: "{{ (tianlai_storage_ip ~ '/' ~ tianlai_storage_prefix_length) if 'storage' in group_names else 'not applicable' }}"
