---
- name: Remove old cache status command
  ansible.builtin.file:
    path: /usr/local/bin/tianlai-status
    state: absent

- name: Install tlcache command
  ansible.builtin.copy:
    dest: /usr/local/bin/tlcache
    mode: '0755'
    content: |
      #!/bin/sh
      exec /usr/bin/python3 {{ tianlai_root }}/tools/cache_status.py --integration-per-trace {{ tianlai_integration_per_trace | int }} "$@"
