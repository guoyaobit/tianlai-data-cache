---
- name: Validate complete deployment inventory before modifying hosts
  hosts: "cache_nodes:storage:controller:display"
  gather_facts: false
  tasks:
    - name: Require all roles and production values
      ansible.builtin.assert:
        that:
          - groups.get('cache_nodes', []) | length == 14
          - groups.get('controller', []) | length == 1
          - groups.get('storage', []) | length == 1
          - groups.get('display', []) | length == 1
          - groups['controller'][0] == groups['storage'][0]
          - ansible_user | default('') == 'ubuntu'
          - tianlai_controller_ip is match('^[0-9.]+$')
          - tianlai_controller_ip == hostvars[groups['storage'][0]].ansible_host
          - tianlai_backend_ip is match('^[0-9.]+$')
          - tianlai_storage_ip is match('^[0-9.]+$')
          - tianlai_storage_directory is match('^/[^ ]+$')
          - "'CHANGE_ME' not in tianlai_storage_directory"
          - tianlai_root is match('^/[^ ]+$')
          - tianlai_period_us | int > 0
          - 1000000 % (tianlai_period_us | int) == 0
          - tianlai_integration_per_trace | int > 0
          - tianlai_notify_port | int >= 1
          - tianlai_notify_port | int <= 65535
          - tianlai_storage_port | int >= 1
          - tianlai_storage_port | int <= 65535
          - (tianlai_storage_port | int) + 13 <= 65535
          - tianlai_storage_lane1_port | int >= 1
          - (tianlai_storage_lane1_port | int) + 13 <= 65535
          - "(tianlai_storage_lane1_port | int) > (tianlai_storage_port | int) + 13 or (tianlai_storage_port | int) > (tianlai_storage_lane1_port | int) + 13"
          - tianlai_storage_io_threads | int >= 1
          - tianlai_storage_io_threads | int <= 32
          - tianlai_controller_port | int >= 1
          - tianlai_controller_port | int <= 65535
          - tianlai_jumbo_mtu | int == 9000
          - tianlai_jumbo_min_speed_mbps | int > 1000
          - tianlai_cache_send_interface == 'ens2f0'
          - tianlai_f0_receive_interfaces | length == 8
          - tianlai_f0_receive_interfaces | unique | list | length == 8
          - tianlai_cache_send_interface not in tianlai_f0_receive_interfaces
          - tianlai_f3_10_receive_interfaces | length == 4
          - tianlai_f3_10_receive_interfaces | unique | list | length == 4
          - tianlai_cache_send_interface not in tianlai_f3_10_receive_interfaces
          - tianlai_disabled_cache_nodes | unique | list | length == tianlai_disabled_cache_nodes | length
          - tianlai_disabled_cache_nodes | difference(groups['cache_nodes']) | length == 0
          - tianlai_disabled_cache_nodes | length < groups['cache_nodes'] | length
          - tianlai_receive_reserved_cores_per_numa | int >= 0
          - tianlai_storage_receive_interface == 'enp152s0f0np0'
          - tianlai_cache_send_network is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - tianlai_cache_send_host_offset | int >= 1
          - (tianlai_cache_send_host_offset | int) + 13 <= 254
          - tianlai_cache_send_prefix_length | int == 24
          - tianlai_storage_prefix_length | int == 24
        fail_msg: Complete the active inventory with all 14 cache nodes, storage/controller host, display host, and actual deployment values.
      run_once: true
    - name: Require complete cache-node data
      ansible.builtin.assert:
        that:
          - hostvars[item].tianlai_server_id is defined
          - hostvars[item].tianlai_server_id | int >= 0
          - hostvars[item].tianlai_server_id | int <= 13
          - hostvars[item].tianlai_control_ip | default('') is match('^[0-9.]+$')
          - >-
            (hostvars[item].tianlai_receive_devices | default('auto')) == 'auto' or
            ('CHANGE_ME' in (hostvars[item].tianlai_receive_devices | default('') | string)) or
            (hostvars[item].tianlai_receive_devices | length ==
            (8 if hostvars[item].tianlai_server_id | int < 3 else 4))
          - >-
            (hostvars[item].tianlai_receive_devices | default('auto')) == 'auto' or
            ('CHANGE_ME' in (hostvars[item].tianlai_receive_devices | default('') | string)) or
            ('CHANGE_ME' not in (hostvars[item].tianlai_receive_devices | join(' ')))
          - >-
            (hostvars[item].tianlai_receive_devices | default('auto')) == 'auto' or
            ('CHANGE_ME' in (hostvars[item].tianlai_receive_devices | default('') | string)) or
            (hostvars[item].tianlai_receive_devices | unique | list | length ==
            hostvars[item].tianlai_receive_devices | length)
          - "'CHANGE_ME' not in (hostvars[item].ansible_host | default('CHANGE_ME'))"
        fail_msg: "Complete cache node {{ item }}: id, management/data IPs, interface, or use auto/manual receive PCI addresses."
      loop: "{{ groups['cache_nodes'] }}"
      run_once: true
    - name: Require a complete unique server ID set
      ansible.builtin.assert:
        that:
          - groups['cache_nodes'] | map('extract', hostvars, 'tianlai_server_id') | map('int') | sort == range(0, 14) | list
          - groups['cache_nodes'] | map('extract', hostvars, 'tianlai_control_ip') | unique | list | length == 14
      run_once: true
    - name: Require controller, storage and display SSH targets
      ansible.builtin.assert:
        that: "'CHANGE_ME' not in (hostvars[item].ansible_host | default('CHANGE_ME'))"
      loop: "{{ (groups['controller'] + groups['storage'] + groups['display']) | unique }}"
      run_once: true

- name: Configure cache data IPs and jumbo MTU with Netplan
  hosts: "cache_nodes:storage:controller"
  gather_facts: false
  become: true
  tasks:
    - name: Apply Netplan network configuration
      ansible.builtin.include_tasks: tasks/network_config.yml

- name: Install network diagnostics on all nodes
  hosts: "cache_nodes:storage:controller:display"
  gather_facts: false
  become: true
  tasks:
    - name: Install network diagnostic packages
      ansible.builtin.include_tasks: tasks/network_tools.yml

- name: Install display-node management clients
  hosts: display
  become: true
  tasks:
    - name: Require Debian-family Linux
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
    - name: Install Python
      ansible.builtin.apt:
        name: python3
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create display client directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ tianlai_root }}/tools"
        - "{{ tianlai_root }}/config"
    - name: Install display management tools
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tools/{{ item }}"
        dest: "{{ tianlai_root }}/tools/{{ item }}"
        mode: '0755'
      loop: [cache_status.py, trigger.py]
    - name: Render display node list
      ansible.builtin.template:
        src: templates/nodes.json.j2
        dest: "{{ tianlai_root }}/config/nodes.json"
        mode: '0640'
    - name: Install tlcache on display node
      ansible.builtin.include_tasks: tasks/install_tlcache.yml
    - name: Install tltrigger on display node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tools/trigger.py"
        dest: /usr/local/bin/tltrigger
        mode: '0755'
    - name: Apply safe display client permissions
      ansible.builtin.include_tasks: tasks/install_permissions.yml

- name: Install storage receiver
  hosts: storage
  become: true
  tasks:
    - name: Require Debian-family Linux
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
    - name: Install storage build dependencies
      ansible.builtin.apt:
        name: [build-essential, pkg-config, libzmq3-dev, libyaml-cpp-dev, nlohmann-json3-dev]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create receiver directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ tianlai_root }}/src/Storage"
        - "{{ tianlai_root }}/bin"
        - "{{ tianlai_root }}/config"
        - "{{ tianlai_storage_directory }}"
    - name: Copy storage receiver sources
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../Storage/{{ item }}"
        dest: "{{ tianlai_root }}/src/Storage/{{ item }}"
        mode: '0644'
      loop: [Makefile, storage_receiver.cpp]
      notify: restart storage
    - name: Build storage receiver
      ansible.builtin.command:
        argv: [make, -j2]
        chdir: "{{ tianlai_root }}/src/Storage"
      environment:
        LC_ALL: C
      register: storage_build
      changed_when: "'Nothing to be done' not in storage_build.stdout and 'is up to date' not in storage_build.stdout"
      notify: restart storage
    - name: Install storage receiver binary
      ansible.builtin.copy:
        remote_src: true
        src: "{{ tianlai_root }}/src/Storage/tianlai-storage"
        dest: "{{ tianlai_root }}/bin/tianlai-storage"
        mode: '0755'
      notify: restart storage
    - name: Render storage receiver configuration
      ansible.builtin.template:
        src: templates/storage.yaml.j2
        dest: "{{ tianlai_root }}/config/storage.yaml"
        mode: '0640'
      notify: restart storage
    - name: Validate storage receiver configuration
      ansible.builtin.command:
        argv:
          - "{{ tianlai_root }}/bin/tianlai-storage"
          - --config
          - "{{ tianlai_root }}/config/storage.yaml"
          - --check-config
      changed_when: false
    - name: Install storage service
      ansible.builtin.template:
        src: templates/storage.service.j2
        dest: /etc/systemd/system/tianlai-storage.service
        mode: '0644'
      notify: restart storage
    - name: Apply storage changes before enabling
      ansible.builtin.meta: flush_handlers
    - name: Enable and start storage
      ansible.builtin.systemd:
        name: tianlai-storage.service
        daemon_reload: true
        enabled: true
        state: started
    - name: Apply safe storage install-tree permissions
      ansible.builtin.include_tasks: tasks/install_permissions.yml
  handlers:
    - name: restart storage
      ansible.builtin.systemd:
        name: tianlai-storage.service
        daemon_reload: true
        state: restarted

- name: Build and install cache nodes
  hosts: cache_nodes
  become: true
  tasks:
    - name: Set node build profile
      ansible.builtin.set_fact:
        tianlai_profile: "{{ 'F0-2' if tianlai_server_id | int < 3 else ('F3-10' if tianlai_server_id | int < 11 else 'F11-13') }}"
    - name: Install receive-NIC ixgbe rebind helper before stopping cache
      ansible.builtin.copy:
        src: files/rebind_ixgbe.sh
        dest: /usr/local/sbin/tianlai-rebind-ixgbe
        mode: '0755'
    - name: Install cache service stop policy before stopping cache
      ansible.builtin.template:
        src: templates/cache.service.j2
        dest: /etc/systemd/system/tianlai-cache.service
        mode: '0644'
    - name: Stop cache during deployment
      ansible.builtin.systemd:
        name: tianlai-cache.service
        daemon_reload: true
        state: stopped
      failed_when: false
    - name: Require Debian-family Linux
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
    - name: Install build dependencies
      ansible.builtin.apt:
        name: [build-essential, pkg-config, libboost-dev, libspdlog-dev, libyaml-cpp-dev, libzmq3-dev]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create node directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ tianlai_root }}/src"
        - "{{ tianlai_root }}/bin"
        - "{{ tianlai_root }}/tools"
        - "{{ tianlai_root }}/src/{{ tianlai_profile }}"
        - "{{ tianlai_root }}/config"
    - name: Install cache status tool on cache nodes
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tools/{{ item }}"
        dest: "{{ tianlai_root }}/tools/{{ item }}"
        mode: '0755'
      loop: [cache_status.py, cache_manager.py, durable_json.py, tcp_json.py]
    - name: Install cache service manager unit
      ansible.builtin.template:
        src: templates/cache-manager.service.j2
        dest: /etc/systemd/system/tianlai-cache-manager.service
        mode: '0644'
    - name: Enable cache service manager
      ansible.builtin.systemd:
        name: tianlai-cache-manager.service
        daemon_reload: true
        enabled: true
        state: restarted
    - name: Render cache status node list
      ansible.builtin.template:
        src: templates/nodes.json.j2
        dest: "{{ tianlai_root }}/config/nodes.json"
        mode: '0640'
    - name: Install tlcache on cache nodes
      ansible.builtin.include_tasks: tasks/install_tlcache.yml
    - name: Copy shared sources
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../Common"
        dest: "{{ tianlai_root }}/src/"
        mode: preserve
      notify: stop cache after deployment
    - name: Install unified build entry point
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../Makefile"
        dest: "{{ tianlai_root }}/src/Makefile"
        mode: '0644'
      notify: stop cache after deployment
    - name: Copy profile entry and build file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ tianlai_profile }}/{{ item }}"
        dest: "{{ tianlai_root }}/src/{{ tianlai_profile }}/{{ item }}"
        mode: '0644'
      loop: [main.cpp, Makefile]
      notify: stop cache after deployment
    - name: Render YAML configuration
      ansible.builtin.template:
        src: "templates/{{ item.source }}"
        dest: "{{ tianlai_root }}/config/{{ item.destination }}"
        mode: '0640'
      loop:
        - {source: recv.yaml.j2, destination: recv.yaml}
        - {source: server.yaml.j2, destination: server.yaml}
      notify: stop cache after deployment
    - name: Check configured ixcap SDK paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: configured_ixcap_files
      loop:
        - "{{ tianlai_ixcap_include }}/ixcap_lib.h"
        - "{{ tianlai_ixcap_lib }}/libixcap.a"
        - "{{ tianlai_ixcap_lib }}/libixcap.so"
    - name: Search common locations for the ixcap header
      ansible.builtin.find:
        paths:
          - /usr/local/include
          - /usr/include
          - /opt
          - "/home/{{ ansible_user }}"
        patterns: ixcap_lib.h
        file_type: any
        recurse: true
      register: ixcap_header_search
    - name: Search common locations for the ixcap library
      ansible.builtin.find:
        paths:
          - /usr/local/lib
          - /usr/lib
          - /usr/lib64
          - /opt
          - "/home/{{ ansible_user }}"
        patterns: [libixcap.a, libixcap.so]
        file_type: any
        recurse: true
      register: ixcap_library_search
    - name: Select configured or discovered ixcap SDK files
      ansible.builtin.set_fact:
        tianlai_ixcap_header_path: >-
          {{ (tianlai_ixcap_include ~ '/ixcap_lib.h')
          if configured_ixcap_files.results[0].stat.exists else
          ((ixcap_header_search.files | map(attribute='path') | sort | first) | default('')) }}
        tianlai_ixcap_library_path: >-
          {{ (tianlai_ixcap_lib ~ '/libixcap.a')
          if configured_ixcap_files.results[1].stat.exists else
          ((tianlai_ixcap_lib ~ '/libixcap.so')
          if configured_ixcap_files.results[2].stat.exists else
          ((ixcap_library_search.files | map(attribute='path') | sort | first) | default(''))) }}
      changed_when: false
    - name: Require the ixcap SDK for the production build
      ansible.builtin.assert:
        that:
          - tianlai_ixcap_header_path | length > 0
          - tianlai_ixcap_library_path | length > 0
        fail_msg: >-
          Production build requires ixcap_lib.h and libixcap.a or libixcap.so.
          Configured include={{ tianlai_ixcap_include }}, lib={{ tianlai_ixcap_lib }};
          found headers={{ ixcap_header_search.files | map(attribute='path') | list }},
          libraries={{ ixcap_library_search.files | map(attribute='path') | list }}.
          Install the ixcap SDK or set tianlai_ixcap_include and tianlai_ixcap_lib.
    - name: Set effective ixcap build directories
      ansible.builtin.set_fact:
        tianlai_ixcap_include_effective: "{{ tianlai_ixcap_header_path | dirname }}"
        tianlai_ixcap_lib_effective: "{{ tianlai_ixcap_library_path | dirname }}"
      changed_when: false
    - name: Display selected ixcap SDK
      ansible.builtin.debug:
        msg:
          header: "{{ tianlai_ixcap_header_path }}"
          library: "{{ tianlai_ixcap_library_path }}"
    - name: Build node for this profile
      ansible.builtin.command:
        argv: [make, -j2, production, "PROFILE={{ tianlai_profile }}", "IXCAP_INCLUDE={{ tianlai_ixcap_include_effective }}", "IXCAP_LIB={{ tianlai_ixcap_lib_effective }}"]
        chdir: "{{ tianlai_root }}/src"
      environment:
        LC_ALL: C
      register: node_build
      changed_when: "'Nothing to be done' not in node_build.stdout and 'is up to date' not in node_build.stdout"
      notify: stop cache after deployment
    - name: Validate rendered node configuration
      ansible.builtin.command:
        argv:
          - "{{ tianlai_root }}/src/{{ tianlai_profile }}/tianlai-store-{{ tianlai_profile | lower }}"
          - "{{ tianlai_root }}/config/server.yaml"
          - "{{ tianlai_root }}/config/recv.yaml"
          - --check-config
      changed_when: false
    - name: Install built binary without overwriting the running build target
      ansible.builtin.copy:
        remote_src: true
        src: "{{ tianlai_root }}/src/{{ tianlai_profile }}/tianlai-store-{{ tianlai_profile | lower }}"
        dest: "{{ tianlai_root }}/bin/tianlai-store-{{ tianlai_profile | lower }}"
        mode: '0755'
      notify: stop cache after deployment
    - name: Apply cache changes before enabling
      ansible.builtin.meta: flush_handlers
    - name: Keep cache disabled and stopped by default
      ansible.builtin.systemd:
        name: tianlai-cache.service
        daemon_reload: true
        enabled: false
        state: stopped
    - name: Restore receive NICs to ixgbe after deployment
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/local/sbin/tianlai-rebind-ixgbe', 'success'] + tianlai_receive_devices }}
      changed_when: true
    - name: Apply safe cache install-tree permissions
      ansible.builtin.include_tasks: tasks/install_permissions.yml
  handlers:
    - name: stop cache after deployment
      ansible.builtin.systemd:
        name: tianlai-cache.service
        daemon_reload: true
        state: stopped

- name: Install trigger controller
  hosts: controller
  become: true
  tasks:
    - name: Stop controller during deployment
      ansible.builtin.systemd:
        name: tianlai-controller.service
        state: stopped
      failed_when: false
    - name: Require Debian-family Linux
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
    - name: Install Python
      ansible.builtin.apt:
        name: python3
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Require Python 3.10 or newer
      ansible.builtin.command: /usr/bin/python3 -c 'import sys; assert sys.version_info >= (3, 10)'
      changed_when: false
    - name: Create controller directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ tianlai_root }}/tools"
        - "{{ tianlai_root }}/config"
        - "{{ tianlai_root }}/journal"
    - name: Install controller tools
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tools/{{ item }}"
        dest: "{{ tianlai_root }}/tools/{{ item }}"
        mode: "{{ '0755' if item in ['cache_status.py', 'trigger.py'] else '0644' }}"
      loop: [controller.py, durable_json.py, tcp_json.py, cache_status.py, trigger.py]
      notify: stop controller after deployment
    - name: Install tlcache on controller
      ansible.builtin.include_tasks: tasks/install_tlcache.yml
    - name: Install tltrigger on controller
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tools/trigger.py"
        dest: /usr/local/bin/tltrigger
        mode: '0755'
    - name: Render controller node list
      ansible.builtin.template:
        src: templates/nodes.json.j2
        dest: "{{ tianlai_root }}/config/nodes.json"
        mode: '0640'
      notify: stop controller after deployment
    - name: Install controller service
      ansible.builtin.template:
        src: templates/controller.service.j2
        dest: /etc/systemd/system/tianlai-controller.service
        mode: '0644'
      notify: stop controller after deployment
    - name: Apply controller changes before enabling
      ansible.builtin.meta: flush_handlers
    - name: Enable and start controller
      ansible.builtin.systemd:
        name: tianlai-controller.service
        daemon_reload: true
        enabled: true
        state: started
    - name: Apply safe controller install-tree permissions
      ansible.builtin.include_tasks: tasks/install_permissions.yml
  handlers:
    - name: stop controller after deployment
      ansible.builtin.systemd:
        name: tianlai-controller.service
        daemon_reload: true
        state: stopped

- name: Generate per-server network reports after code deployment
  hosts: "cache_nodes:storage:controller:display"
  gather_facts: false
  become: true
  tasks:
    - name: Collect and save network information
      ansible.builtin.include_tasks: tasks/network_report.yml
    - name: Apply safe install-tree permissions after network reporting
      ansible.builtin.include_tasks: tasks/install_permissions.yml
    - name: Create local Markdown report directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/reports"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Reset successful network-report host list
      ansible.builtin.set_fact:
        tianlai_network_report_hosts: []
      delegate_to: localhost
      delegate_facts: true
      become: false
      run_once: true
    - name: Select hosts that completed network inventory
      ansible.builtin.set_fact:
        tianlai_network_report_hosts: >-
          {{ hostvars['localhost'].tianlai_network_report_hosts + [item] }}
      loop: "{{ ansible_play_hosts_all | sort }}"
      when: hostvars[item].network_inventory is defined
      delegate_to: localhost
      delegate_facts: true
      become: false
      run_once: true
    - name: Save consolidated network inventory as Markdown
      ansible.builtin.template:
        src: templates/network-inventory.md.j2
        dest: "{{ playbook_dir }}/reports/network-inventory.md"
        mode: '0600'
      vars:
        requested_hosts: "{{ ansible_play_hosts_all | sort }}"
        inspected_hosts: "{{ hostvars['localhost'].tianlai_network_report_hosts }}"
        missing_hosts: "{{ requested_hosts | difference(inspected_hosts) | sort }}"
      delegate_to: localhost
      become: false
      run_once: true
    - name: Show local Markdown report location
      ansible.builtin.debug:
        msg: "Markdown report: {{ playbook_dir }}/reports/network-inventory.md"
      run_once: true
