---
# Replace every CHANGE_ME value before deployment.
# SSH account shared by all target servers.
ansible_user: ubuntu
# Install root on target servers.
tianlai_root: /opt/tianlai-store
# MTU applied to physical interfaces faster than 1 Gb/s.
tianlai_jumbo_mtu: 9000
# 1001 includes 2.5/10/25/40/100 GbE and excludes 1 GbE.
tianlai_jumbo_min_speed_mbps: 1001
# Fixed cache-node storage-data interface.
tianlai_cache_send_interface: ens2f0
# Ordered receive interfaces on cache nodes 1-3.
tianlai_f0_receive_interfaces: [ens4f0, ens4f1, ens5f0, ens5f1, ens1f0, ens1f1, ens3f0, ens3f1]
# Ordered receive interfaces on cache nodes 4-11.
tianlai_f3_10_receive_interfaces: [ens4f0, ens4f1, ens5f0, ens5f1]
# Cache hosts excluded from controller scheduling during debugging.
tianlai_disabled_cache_nodes: []
# Physical CPU cores reserved per NIC NUMA node.
tianlai_receive_reserved_cores_per_numa: 1
# Fixed 100 GbE receive interface on the storage server.
tianlai_storage_receive_interface: enp152s0f0np0
# server ID 0-13 maps to 192.168.210.100-113/24.
tianlai_cache_send_network: 192.168.210
tianlai_cache_send_host_offset: 100
tianlai_cache_send_prefix_length: 24
tianlai_storage_prefix_length: 24
# Controller management IP on the storage server.
tianlai_controller_ip: 172.0.0.142
# Backend IP for triggers and completion notices.
tianlai_backend_ip: 192.168.200.10
# Data IP on the storage server's 100 GbE interface.
tianlai_storage_ip: 192.168.210.250
# Event path under the mounted storage directory.
tianlai_storage_directory: /data
# Integration period (us); must match acquisition.
tianlai_period_us: 200
# Integration periods per trace; must match acquisition.
tianlai_integration_per_trace: 50000
# Cache-node TCP/JSON control port.
tianlai_control_port: 19000
# Controller TCP/JSON port for backend requests.
tianlai_controller_port: 18999
# Backend TCP/JSON result port.
tianlai_notify_port: 19001
# First ZeroMQ/TCP storage data port.
tianlai_storage_port: 20000
# First lane-1 ZeroMQ/TCP storage port.
tianlai_storage_lane1_port: 20100
# ZeroMQ I/O workers serving the 100 GbE interface.
tianlai_storage_io_threads: 2
# Directory containing ixcap_lib.h.
tianlai_ixcap_include: /usr/local/include
# Directory containing libixcap.a or libixcap.so.
tianlai_ixcap_lib: /usr/local/lib
