# Example INI inventory. Replace every CHANGE_ME before rollout; HDM addresses are not used for SSH.
[all:vars]
ansible_user=ubuntu
tianlai_controller_ip=192.168.200.250
tianlai_backend_ip=192.168.200.10
tianlai_storage_ip=192.168.210.250
tianlai_storage_directory=/data/raw-store
tianlai_storage_port=20000
tianlai_storage_lane1_port=20100
tianlai_storage_io_threads=2

# ens2f0 and 192.168.210.100-113 are derived from server ID during deployment.
# auto selects 8 Intel ixcap PCI devices for nodes 0-2 and 4 for all other nodes.
[cache_nodes]
tianlaistore1  ansible_host=172.0.0.128 tianlai_server_id=0  tianlai_control_ip=172.0.0.128 tianlai_send_interface=ens2f0 tianlai_send_ip=192.168.210.100 tianlai_receive_devices=auto
tianlaistore2  ansible_host=172.0.0.129 tianlai_server_id=1  tianlai_control_ip=172.0.0.129 tianlai_send_interface=ens2f0 tianlai_send_ip=192.168.210.101 tianlai_receive_devices=auto
