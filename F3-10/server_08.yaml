# Example: verify addresses, PCI IDs, and acquisition ID.
# Cache-node network, NIC, and logging settings.
SERVERID: 8  # Unique cache node ID (0-13).
controlBindIp: "172.0.0.136"  # Local management IP for control commands.
controlPeerIp: "172.0.0.142"  # Controller IP allowed to send commands.
controlPort: 19000  # Local management TCP/JSON control port.
logFilePath: "-"  # Log path; "-" writes only to stderr.
deviceName0: "CHANGE_ME_PCI_0"  # ixcap PCI address for this receive port.
cpuId0: -1  # Receive-thread CPU ID; -1 disables affinity.
deviceName1: "CHANGE_ME_PCI_1"  # ixcap PCI address for this receive port.
cpuId1: -1  # Receive-thread CPU ID; -1 disables affinity.
deviceName2: "CHANGE_ME_PCI_2"  # ixcap PCI address for this receive port.
cpuId2: -1  # Receive-thread CPU ID; -1 disables affinity.
deviceName3: "CHANGE_ME_PCI_3"  # ixcap PCI address for this receive port.
cpuId3: -1  # Receive-thread CPU ID; -1 disables affinity.
sendEthName: "ens2f0"  # Single storage-network transmit interface; both lanes share it.
sendSourceIp: "192.168.210.108"  # Local storage-network source IP.
sendDestinationIp: "192.168.210.250"  # Storage receiver data-network IP.
sendDestinationPort0: 20008  # Logical lane ports on the same physical link.
sendDestinationPort1: 20108
