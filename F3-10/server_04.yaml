# Example: verify addresses, PCI IDs, and acquisition ID.
# Cache-node network, NIC, and logging settings.
serverCfg:
  # Unique cache node ID (0-13).
  SERVERID: 4
  # Local management IP for control commands.
  controlBindIp: "172.0.0.132"
  # Controller IP allowed to send commands.
  controlPeerIp: "192.168.200.250"
  # Local management TCP/JSON control port.
  controlPort: 19000
  # Log path; "-" writes only to stderr.
  logFilePath: "-"
  # ixcap PCI address for this receive port.
  deviceName0: "CHANGE_ME_PCI_0"
  # Receive-thread CPU ID; -1 disables affinity.
  cpuId0: -1
  # Local UDP port for simulation only.
  simulationPort0: 20040
  # ixcap PCI address for this receive port.
  deviceName1: "CHANGE_ME_PCI_1"
  # Receive-thread CPU ID; -1 disables affinity.
  cpuId1: -1
  # Local UDP port for simulation only.
  simulationPort1: 20041
  # ixcap PCI address for this receive port.
  deviceName2: "CHANGE_ME_PCI_2"
  # Receive-thread CPU ID; -1 disables affinity.
  cpuId2: -1
  # Local UDP port for simulation only.
  simulationPort2: 20042
  # ixcap PCI address for this receive port.
  deviceName3: "CHANGE_ME_PCI_3"
  # Receive-thread CPU ID; -1 disables affinity.
  cpuId3: -1
  # Local UDP port for simulation only.
  simulationPort3: 20043
  # Single storage-network transmit interface; both lanes share it.
  sendEthName: "ens2f0"
  # Local storage-network source IP.
  sendSourceIp: "192.168.210.104"
  # Storage receiver data-network IP.
  sendDestinationIp: "192.168.210.250"
  # Logical lane ports on the same physical link.
  sendDestinationPort0: 20004
  sendDestinationPort1: 20104
