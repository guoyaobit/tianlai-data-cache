# Storage example; verify addresses before deployment.
storage:
  # Use a mounted array path validated for capacity/throughput.
  directory: "/data/raw-store"
  # ZeroMQ I/O workers for the 100 GbE receiver.
  ioThreads: 2
  # Both logical lanes share one physical 100 GbE interface and IP.
  receivers:
    - serverId: 0
      lane: 0
      bindAddress: "192.168.210.250"
      port: 20000
      allowedSource: "192.168.210.100"
